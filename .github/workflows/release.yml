name: Release iTranslate

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [ 22 ]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build package
        run: pnpm build
      - name: Rename dist to iTranslate
        run: mv dist iTranslate
      - name: Create archive
        run: zip -r iTranslate.zip iTranslate
      - name: Publish release asset
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag: production-latest
          name: Production Latest
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: iTranslate.zip
          body: |
            Automated build from branch `production`.
